<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - La Piazzetta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">
    <header id="cabecalho-principal">
        <div class="container header-flex">
            <a href="index.html" class="logo">🍕 La Piazzetta</a>
            <nav>
                <ul class="menu-principal">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="cardapio.html">Cardápio</a></li>
                    <li class="has-submenu">
                        <a href="#" id="btn-sobre">Sobre ▾</a>
                        <ul id="menu-vertical-sobre" class="submenu">
                            <li><a href="#" id="item-empresa">Empresa</a></li>
                            <li><a href="#" id="item-clientes">Clientes</a></li>
                        </ul>
                    </li>
                    <li class="has-submenu">
                        <a href="#" id="btn-contato">Contato ▾</a>
                        <ul id="menu-vertical-contato" class="submenu">
                            <li><a href="#" id="item-telefones">Telefones</a></li>
                            <li><a href="#" id="item-email">Email</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container" style="max-width:900px; margin:0 auto; padding: 40px 20px;">
        <div class="dashboard-head" style="margin-bottom: 25px;">
            <h1 style="color: var(--laranja-queijo);">🛒 Meu Carrinho</h1>
            <p id="saudacao-carrinho"></p>
        </div>
        <div class="form-wrapper" style="max-width: 100%; padding:30px; margin-bottom:30px;">
            <div id="container-itens-carrinho"></div>
            <div style="margin-top:30px; border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;">
                <h3 style="color: var(--laranja-queijo);">Resumo da Compra</h3>
                <div style="display:flex; justify-content:space-between; margin-top:10px;">
                    <span>Subtotal:</span>
                    <strong id="subtotal">R$ 0,00</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:8px;">
                    <span>Taxa de Entrega:</span>
                    <strong id="taxa-entrega">R$ 8,00</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:1.3rem; color:var(--laranja-queijo); font-weight:900;">
                    <span>Total do Pedido:</span>
                    <span id="total-geral">R$ 8,00</span>
                </div>
                <div style="display:flex; flex-direction:column; gap:12px; margin-top:25px;">
                    <button id="btn-limpar-carrinho" class="btn btn-secundario" style="width:100%;">
                        🗑️ Limpar Carrinho
                    </button>
                    <a href="cardapio.html" style="text-align:center; color:var(--creme); font-weight:700; margin-top:10px;">← Voltar ao cardápio</a>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; <span id="data-atual"></span> <strong>La Piazzetta</strong>. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
