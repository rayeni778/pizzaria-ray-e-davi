<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - Sabor & Brasa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">
    <header class="main-header" id="site-header">
        <div class="header-content">
            <a class="logo" href="index.html">
                <span class="logo-icon">🔥</span>
                <span>Sabor <span>&</span> Brasa</span>
            </a>
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <nav class="main-nav" id="main-nav">
                <a href="index.html">Início</a>
                <a href="saborBrasa.html">Cardápio</a>
                <a href="sobre.html">Nossa História</a>
                <a href="site.html">Área VIP</a>
                <a href="carrinho.html" class="active">
                    🛒 Carrinho <span id="contador-carrinho" style="background:var(--color-accent);padding:2px 8px;border-radius:12px;font-size:0.75rem;">0</span>
                </a>
            </nav>
        </div>
    </header>
    <main class="section-container" style="max-width:900px; margin:0 auto;">
        <div class="dashboard-head">
            <h1>🛒 Meu <span>Carrinho</span></h1>
            <p id="saudacao-carrinho"></p>
        </div>
        <div class="card" style="padding:30px; margin-bottom:30px;">
            <div id="container-itens-carrinho">
            </div>
            <div style="margin-top:30px; border-top:1px solid var(--border-light); padding-top:20px;">
                <h3>Resumo da Compra</h3>
                <div style="display:flex; justify-content:space-between; margin-top:10px;">
                    <span>Subtotal:</span>
                    <strong id="subtotal">R$ 0,00</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:8px;">
                    <span>Taxa de Entrega:</span>
                    <strong id="taxa-entrega">R$ 8,00</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:1.3rem; color:var(--color-accent); font-weight:900;">
                    <span>Total do Pedido:</span>
                    <span id="total-geral">R$ 8,00</span>
                </div>
                <div style="display:flex; flex-direction:column; gap:12px; margin-top:25px;">
                    <button id="btn-finalizar-whatsapp" class="btn btn-primary" style="width:100%;">
                        📲 Finalizar Pedido via WhatsApp
                    </button>
                    <button id="btn-limpar-carrinho" class="btn btn-secondary" style="color:var(--color-dark); border-color:var(--color-dark); width:100%;">
                        🗑️ Limpar Carrinho
                    </button>
                    <a href="saborBrasa.html" style="text-align:center; color:var(--text-muted); font-weight:700; margin-top:10px;">← Voltar ao cardápio</a>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-bottom">
            <p>&copy; <span id="data-atual"></span> Sabor & Brasa. Todos os direitos reservados.</p>
        </div>
    </footer>
    <div id="toast-notificacao" class="alert alert-success" style="position:fixed; bottom:20px; right:20px; z-index:10000; display:none;"></div>
    <script src="script.js"></script>
</body>
</html>
